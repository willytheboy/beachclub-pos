<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#020617">
    <title>Sporting Club AI PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Tajawal:wght@400;500;700;800;900&display=swap');

        :root {
            --app-height: 100dvh;
            --primary: #2563eb;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #020617;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
            height: var(--app-height);
            width: 100%;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        body.rtl { font-family: 'Tajawal', sans-serif; direction: rtl; }

        .app-container {
            width: 100%;
            max-width: 500px;
            height: var(--app-height);
            display: flex;
            flex-direction: column;
            position: relative;
            background: radial-gradient(circle at top right, #1e293b 0%, #020617 100%);
        }

        #chat-container::-webkit-scrollbar { width: 3px; }
        #chat-container::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        .glass {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .safe-bottom { padding-bottom: calc(env(safe-area-inset-bottom) + 1rem); }
        .safe-top { padding-top: env(safe-area-inset-top); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.3s ease-out forwards; }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .spinner { animation: spin 1s linear infinite; }

        .prose a { color: #60a5fa; text-decoration: underline; font-weight: 800; word-break: break-all; }
        .prose strong { color: #fff; }

        /* Admin Gate - Hitbox in top right */
        #btn-gate {
            opacity: 0;
            cursor: pointer;
            width: 80px;
            height: 64px;
            position: absolute;
            right: 0;
            top: 0;
            z-index: 50;
            background: transparent;
            border: none;
        }

        .ai-action-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.2s;
        }
        .ai-action-btn:active { transform: scale(0.95); }

        .verified-link {
            color: #60a5fa !important;
            font-weight: 900 !important;
            border-bottom: 2px solid rgba(96, 165, 250, 0.3);
        }

        .lang-toggle { background: rgba(255,255,255,0.05); border-radius: 9999px; padding: 2px; }
        .lang-toggle button { padding: 4px 10px; border-radius: 9999px; font-size: 10px; font-weight: 800; transition: all 0.2s; }
        .lang-toggle button.active { background: var(--primary); color: white; }

        .loader-ring {
            border: 2px solid rgba(255,255,255,0.1);
            border-top: 2px solid #60a5fa;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            animation: spin 0.8s linear infinite;
        }
    </style>
</head>
<body class="text-slate-200">

    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] w-[92%] max-w-xs glass rounded-2xl p-4 shadow-2xl transition-all duration-300 opacity-0 pointer-events-none transform -translate-y-full border border-white/10">
        <div class="flex items-center gap-3">
            <div id="toast-icon" class="w-8 h-8 rounded-full flex items-center justify-center bg-blue-500/20 text-blue-400 text-xs font-bold font-mono">!</div>
            <p id="toast-msg" class="text-xs font-bold tracking-tight uppercase"></p>
        </div>
    </div>

    <div class="app-container shadow-2xl">
        <header class="p-4 flex justify-between items-center glass rounded-b-[2.5rem] z-20 shadow-2xl relative safe-top">
            <div class="flex items-center gap-3 text-left">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center shadow-lg relative">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                </div>
                <div>
                    <h1 class="text-sm font-black tracking-tight text-white leading-none uppercase">Sporting Club</h1>
                    <span class="text-[9px] font-bold text-blue-400 tracking-widest uppercase">PRO Concierge</span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <div class="lang-toggle flex">
                    <button id="lang-en" class="active">EN</button>
                    <button id="lang-ar">ع</button>
                </div>
                <button id="btn-recap" class="px-3 py-1.5 rounded-full ai-action-btn text-[9px] font-black uppercase tracking-widest text-slate-400 hover:text-white" title="Summarize conversation">✨ Recap</button>
            </div>
            <button id="btn-gate" aria-label="Admin Module"></button>
        </header>

        <section id="chat-container" class="flex-1 overflow-y-auto p-5 space-y-6 pt-8 pb-36 custom-scroll"></section>

        <footer class="absolute bottom-0 left-0 w-full p-4 bg-gradient-to-t from-slate-950 via-slate-950/80 to-transparent z-20 safe-bottom">
            <div class="glass rounded-[2rem] flex flex-col gap-2 p-1.5 focus-within:ring-2 ring-blue-500/40 transition-all shadow-2xl border border-white/10">
                <div id="image-preview-container" class="hidden px-3 pt-2">
                    <div class="relative w-16 h-16 rounded-xl overflow-hidden border border-white/20">
                        <img id="image-preview" src="" class="w-full h-full object-cover">
                        <button id="btn-remove-image" class="absolute top-0 right-0 bg-black/50 text-white w-5 h-5 flex items-center justify-center text-xs">&times;</button>
                    </div>
                </div>
                <div class="flex items-end gap-2">
                    <label class="w-12 h-12 rounded-full ai-action-btn flex items-center justify-center cursor-pointer active:scale-95 shrink-0" title="Vision upload">
                        <input type="file" id="input-image-file" class="hidden" accept="image/*">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-slate-400"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                    </label>
                    <textarea id="user-input" rows="1" class="flex-1 bg-transparent border-none text-white text-[15px] p-3 outline-none resize-none min-h-[48px] max-h-[120px]" placeholder="Ask me about memberships, menus..."></textarea>
                    <button id="btn-send" class="w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center shadow-lg active:scale-90 transition-all disabled:bg-slate-800 disabled:opacity-50 shrink-0">
                        <div id="send-icon"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="m22 2-11 11"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg></div>
                        <div id="loading-icon" class="hidden"><div class="loader-ring"></div></div>
                    </button>
                </div>
            </div>
        </footer>
    </div>

    <!-- Admin Panel Overlay -->
    <div id="modal-admin" class="fixed inset-0 z-50 bg-slate-950/98 flex items-center justify-center p-4 hidden opacity-0 transition-all duration-300">
        <div class="bg-slate-900 w-full max-w-sm h-[90dvh] max-h-[850px] rounded-[3.5rem] shadow-2xl border border-white/10 flex flex-col overflow-hidden">
            <div class="p-6 border-b border-white/5 flex justify-between items-center bg-slate-900/50">
                <div class="text-left"><h2 class="font-black text-lg uppercase tracking-tight text-white">Logic Center</h2></div>
                <button id="btn-close-admin" class="w-10 h-10 rounded-full hover:bg-white/5 flex items-center justify-center text-2xl text-slate-500 transition-colors">&times;</button>
            </div>
            <div class="flex-1 overflow-y-auto p-6 space-y-10 custom-scroll">

                <div class="bg-blue-600/5 rounded-[2rem] p-6 border border-blue-500/10 text-left">
                    <h3 class="text-[10px] font-black uppercase tracking-widest text-blue-400 mb-2">Knowledge Sync</h3>
                    <div class="flex flex-col gap-2">
                        <button id="btn-export" class="w-full py-3.5 bg-blue-600 rounded-2xl text-[10px] font-black uppercase active:scale-95">Download Logic</button>
                        <button id="btn-import-trigger" class="w-full py-3.5 bg-slate-800 rounded-2xl text-[10px] font-black uppercase active:scale-95">Upload Logic</button>
                        <input type="file" id="input-import" class="hidden" accept=".json">
                    </div>
                </div>

                <section class="text-left">
                    <h3 class="text-[10px] font-black uppercase tracking-widest text-slate-600 mb-3 ml-1">Ambassador Behavior</h3>
                    <div class="flex flex-col gap-2 mb-4">
                        <textarea id="input-instr" class="w-full bg-slate-950 rounded-2xl p-4 text-xs border border-white/5 outline-none focus:border-blue-500 transition-all placeholder-slate-700" placeholder="e.g. Always mention the iconic 1953 pools..." rows="3"></textarea>
                        <button id="btn-save-instr" class="w-full py-4 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg active:scale-95 text-[10px] font-black uppercase">Add Directive</button>
                    </div>
                    <div id="list-instr" class="space-y-2"></div>
                </section>

                <section class="text-left">
                    <h3 class="text-[10px] font-black uppercase tracking-widest text-slate-600 mb-3 ml-1">Source of Truth (URLs)</h3>
                    <div class="bg-slate-950 rounded-[2.5rem] p-6 border border-white/5 space-y-4 mb-4 shadow-inner">
                        <input type="text" id="input-qa-q" class="w-full bg-slate-950 rounded-xl p-4 text-sm border border-white/10 outline-none focus:border-blue-500 text-white" placeholder="Label (e.g. Pool Menu)">
                        <textarea id="input-qa-a" class="w-full bg-slate-950 rounded-xl p-4 text-sm border border-white/10 outline-none focus:border-blue-500 text-white" placeholder="Exact verified URL..." rows="4"></textarea>
                        <button id="btn-save-qa" class="w-full py-4 bg-blue-600 rounded-2xl text-[10px] font-black uppercase active:scale-95">Set Truth</button>
                    </div>
                    <div id="list-qa" class="space-y-3 pb-16"></div>
                </section>
            </div>
            <div class="p-6 bg-slate-900 border-t border-white/5">
                <button id="btn-lock" class="w-full py-4 text-[10px] font-black uppercase tracking-[0.4em] text-slate-600 hover:text-red-400 transition-colors">Lock Training</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        // --- Core Configuration ---
        const apiKey = typeof __api_key !== 'undefined' ? __api_key : "";
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'sporting-club-pro-v1';

        const CONFIG = {
            MODELS: {
                TEXT: "gemini-1.5-pro-002", // UPGRADED TO PRO
                TTS: "gemini-2.5-flash-preview-tts"
            },
            INSTAGRAM: "https://www.instagram.com/sportingbeach/",
            RETRIES: 5
        };

        let user = null;
        let localState = { instructions: [], qa: [], history: [], lang: 'en', selectedImage: null };

        // --- Custom Markdown Link Renderer ---
        const renderer = new marked.Renderer();
        renderer.link = (href, title, text) => {
            const linkText = String(text || 'Link');
            let actualHref = CONFIG.INSTAGRAM;

            // Search Verified Truths for Label Match
            const truth = localState.qa.find(it => linkText.toLowerCase().includes(it.q.toLowerCase()) || it.q.toLowerCase().includes(linkText.toLowerCase()));
            if (truth) actualHref = truth.a;
            else if (href && href.startsWith('http') && !href.toLowerCase().includes('undefined')) actualHref = href;

            return `<a href="${actualHref}" target="_blank" rel="noopener noreferrer" class="verified-link underline font-black">${linkText}</a>`;
        };
        marked.setOptions({ renderer, breaks: true, gfm: true });

        const els = {
            toast: document.getElementById('toast'),
            toastMsg: document.getElementById('toast-msg'),
            chat: document.getElementById('chat-container'),
            input: document.getElementById('user-input'),
            btnSend: document.getElementById('btn-send'),
            btnGate: document.getElementById('btn-gate'),
            modalAdmin: document.getElementById('modal-admin'),
            listQa: document.getElementById('list-qa'),
            listInstr: document.getElementById('list-instr'),
            btnRecap: document.getElementById('btn-recap'),
            inputImage: document.getElementById('input-image-file'),
            previewContainer: document.getElementById('image-preview-container'),
            previewImg: document.getElementById('image-preview'),
            btnRemoveImg: document.getElementById('btn-remove-image'),
            sendIcon: document.getElementById('send-icon'),
            loadingIcon: document.getElementById('loading-icon'),
            inputInstr: document.getElementById('input-instr'),
            btnSaveInstr: document.getElementById('btn-save-instr'),
            inputQaQ: document.getElementById('input-qa-q'),
            inputQaA: document.getElementById('input-qa-a'),
            btnSaveQa: document.getElementById('btn-save-qa')
        };

        function notify(msg) {
            els.toastMsg.innerText = msg;
            els.toast.classList.replace('opacity-0', 'opacity-100');
            els.toast.classList.replace('-translate-y-full', 'translate-y-0');
            setTimeout(() => {
                els.toast.classList.replace('opacity-100', 'opacity-0');
                els.toast.classList.replace('translate-y-0', '-translate-y-full');
            }, 3000);
        }

        // --- Nuclear Scrubber for Pro Build ---
        function scrubAIResponse(text) {
            if (!text) return "";
            let ft = String(text);

            ft = ft.replace(/\bundefined\b/gi, '');
            ft = ft.replace(/<a\s+href=["']?undefined[^>]*>(.*?)<\/a>/gi, `<a href="${CONFIG.INSTAGRAM}" target="_blank">$1</a>`);

            const nakedUrlRegex = /(?<!\(|\[|<)(https?:\/\/[^\s\)]+|www\.[^\s\)]+|[a-zA-Z0-9-]+\.[a-z]{2,}(?:\/[^\s\)]*)?)(?!\)|\]|>)/gi;
            ft = ft.replace(nakedUrlRegex, (m) => {
                if (m.toLowerCase().includes('undefined')) return '';
                let u = m.startsWith('http') ? m : 'https://' + m;
                return `[${m}](${u})`;
            });

            const repair = [
                { regex: /:\s*undefined/gmi, replacement: `: [Visit Instagram](${CONFIG.INSTAGRAM})` },
                { regex: /undefined\{:target="_blank"\}/gi, replacement: `[Link](${CONFIG.INSTAGRAM})` }
            ];
            repair.forEach(p => ft = ft.replace(p.regex, p.replacement));

            return ft.trim();
        }

        function renderMsg(role, text, isImage = false) {
            if (!text && !isImage) return;
            const isAI = role === 'ai';
            const div = document.createElement('div');
            div.className = `flex w-full ${!isAI ? 'justify-end' : 'justify-start'} animate-in duration-300`;

            let html = "";
            if (isImage) {
                html = `<img src="${text}" class="max-w-[200px] rounded-2xl border border-white/10 shadow-lg">`;
            } else {
                const cleaned = isAI ? scrubAIResponse(text) : text;
                const sanitized = DOMPurify.sanitize(marked.parse(cleaned));
                html = `<div class="prose prose-sm prose-invert max-w-none">${sanitized}</div>`;
                if (isAI) {
                    html += `<button class="listen-btn mt-2 text-[10px] font-black text-slate-500 hover:text-white uppercase">✨ Listen</button>`;
                }
            }

            div.innerHTML = `<div class="max-w-[88%] rounded-[1.8rem] p-4 text-[14px] shadow-2xl ${isAI ? 'bg-slate-800/95 border border-white/5 text-left' : 'bg-blue-600 text-white text-right'}">${html}</div>`;
            if (isAI && !isImage) {
                const listenBtn = div.querySelector('.listen-btn');
                if (listenBtn) listenBtn.addEventListener('click', () => window.speak(text));
            }
            els.chat.appendChild(div);
            els.chat.scrollTop = els.chat.scrollHeight;
        }

        async function callGemini(contents, system, model = CONFIG.MODELS.TEXT, useTools = true, attempt = 0) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
            const payload = { contents, systemInstruction: { parts: [{ text: system }] } };
            if (useTools && model === CONFIG.MODELS.TEXT) payload.tools = [{ "google_search": {} }];

            try {
                const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const data = await res.json();
                if (data.error) throw new Error(data.error.message);
                return data;
            } catch (e) {
                if (attempt < CONFIG.RETRIES) {
                    const delay = Math.pow(2, attempt) * 1000;
                    await new Promise(r => setTimeout(r, delay));
                    return callGemini(contents, system, model, (attempt < 2), attempt + 1);
                }
                throw e;
            }
        }

        async function chat() {
            if (!user) return notify("AUTHENTICATING...");
            const val = els.input.value.trim();
            if (!val && !localState.selectedImage) return;

            els.input.value = '';
            els.btnSend.disabled = true;
            els.sendIcon.classList.add('hidden');
            els.loadingIcon.classList.remove('hidden');

            if (localState.selectedImage) renderMsg("user", localState.selectedImage, true);
            if (val) {
                renderMsg("user", val);
                localState.history.push({ role: "user", text: val });
            }

            const sys = `IDENTITY: Premium Brand Ambassador for Sporting Club Beirut. Respond in ${localState.lang === 'ar' ? 'Arabic' : 'English'}.
            AUTHORITY: The provided VERIFIED TRUTHS are absolute. If a link is missing from the truth list, default strictly to Instagram: ${CONFIG.INSTAGRAM}.
            CRITICAL RULES: NEVER mention "undefined". Stick to a welcoming, professional, and positive tone.
            TRUTHS: ${localState.qa.map(q => `${q.q}: ${q.a}`).join(' | ')}
            BEHAVIOR: ${localState.instructions.join(' | ')}`;

            let parts = [{ text: val || "Examine this Sporting Club Beirut image." }];
            if (localState.selectedImage) {
                parts.push({ inlineData: { mimeType: "image/png", data: localState.selectedImage.split(',')[1] } });
                localState.selectedImage = null;
                els.previewContainer.classList.add('hidden');
            }

            try {
                const res = await callGemini(localState.history.slice(-10).map(m => ({ role: m.role === 'ai' ? 'model' : 'user', parts: [{ text: m.text || "Context analysis." }] })).concat({ role: 'user', parts }), sys);
                const aiText = res.candidates?.[0]?.content?.parts?.[0]?.text || "I am here to assist.";
                renderMsg("ai", aiText);
                localState.history.push({ role: "ai", text: aiText });
                await syncToCloud();
            } catch (e) {
                notify("CONGESTION DETECTED");
                renderMsg("ai", "I am currently overloaded with requests. Please follow us on Instagram for updates: " + CONFIG.INSTAGRAM);
            } finally {
                els.btnSend.disabled = false;
                els.sendIcon.classList.remove('hidden');
                els.loadingIcon.classList.add('hidden');
            }
        }

        // --- Audio Hub ---
        window.speak = async (text) => {
            try {
                const res = await callGemini([{ parts: [{ text: "Professional read: " + text.substring(0, 400) }] }], "TTS Service", CONFIG.MODELS.TTS, false);
                const data = res.candidates[0].content.parts[0].inlineData.data;
                const blob = pcmToWav(data, 24000);
                new Audio(URL.createObjectURL(blob)).play();
            } catch (e) { notify("AUDIO OFFLINE"); }
        };

        function pcmToWav(base64, rate) {
            const bin = atob(base64), buf = new ArrayBuffer(bin.length + 44), view = new DataView(buf);
            const s = (o, str) => { for (let i = 0; i < str.length; i++) view.setUint8(o + i, str.charCodeAt(i)); };
            s(0, 'RIFF'); view.setUint32(4, 36 + bin.length, true); s(8, 'WAVE');
            s(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
            view.setUint16(22, 1, true); view.setUint32(24, rate, true);
            view.setUint32(28, rate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
            s(36, 'data'); view.setUint32(40, bin.length, true);
            for (let i = 0; i < bin.length; i++) view.setUint8(44 + i, bin.charCodeAt(i));
            return new Blob([buf], { type: 'audio/wav' });
        }

        // --- Persistence Hub ---
        async function syncToCloud() {
            if (!user) return;
            const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'state');
            await setDoc(docRef, { instructions: localState.instructions, qa: localState.qa, lang: localState.lang, history: localState.history.slice(-15) });
        }

        async function init() {
            const initAuth = async () => {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            };
            await initAuth();
            onAuthStateChanged(auth, async (u) => {
                user = u;
                if (user) {
                    const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'state');
                    const snap = await getDoc(docRef);
                    if (snap.exists()) {
                        const cloudData = snap.data();
                        localState = { ...localState, ...cloudData };
                        els.chat.innerHTML = '';
                        localState.history.forEach(m => renderMsg(m.role, m.text));
                        renderAdminUI();
                    } else {
                        renderMsg("ai", "Welcome to **Sporting Club Beirut**. I am your PRO concierge. How can I assist you today?");
                    }
                    if (localState.lang === 'ar') document.body.classList.add('rtl');
                    document.getElementById(`lang-${localState.lang || 'en'}`).classList.add('active');
                }
            });
        }

        function renderAdminUI() {
            els.listQa.innerHTML = localState.qa.map((it, i) => `<div class="bg-slate-950 p-5 rounded-[2rem] text-[11px] border border-white/5 mb-3 text-left"><div class="flex justify-between mb-2 opacity-30 font-black">Truth #${i+1} <button onclick="window.delAdmin('qa', ${i})">×</button></div><div class="font-black text-blue-500">${it.q}</div><div class="text-slate-400 italic break-all">${it.a}</div></div>`).join('');
            els.listInstr.innerHTML = localState.instructions.map((t, i) => `<div class="bg-slate-950 p-4 rounded-2xl flex justify-between items-center text-[10px] border border-white/5 mb-2 text-slate-400 text-left"><span class="flex-1">${t}</span><button onclick="window.delAdmin('instructions', ${i})" class="p-2">×</button></div>`).join('');
        }

        window.delAdmin = (key, idx) => { localState[key].splice(idx, 1); syncToCloud(); renderAdminUI(); };

        els.btnSaveInstr.onclick = () => { if(els.inputInstr.value.trim()){ localState.instructions.push(els.inputInstr.value.trim()); els.inputInstr.value = ''; syncToCloud(); renderAdminUI(); notify("RULES UPDATED"); } };
        els.btnSaveQa.onclick = () => { if(els.inputQaQ.value.trim() && els.inputQaA.value.trim()){ localState.qa.push({ q: els.inputQaQ.value.trim(), a: els.inputQaA.value.trim() }); els.inputQaQ.value = ''; els.inputQaA.value = ''; syncToCloud(); renderAdminUI(); notify("TRUTH LOCKED"); } };

        els.inputImage.onchange = (e) => {
            const f = e.target.files[0]; if(!f) return;
            const r = new FileReader();
            r.onload = (ev) => { localState.selectedImage = ev.target.result; els.previewImg.src = ev.target.result; els.previewContainer.classList.remove('hidden'); };
            r.readAsDataURL(f);
        };
        els.btnRemoveImg.onclick = () => { localState.selectedImage = null; els.previewContainer.classList.add('hidden'); };

        document.getElementById('lang-en').onclick = () => { localState.lang = 'en'; syncToCloud(); location.reload(); };
        document.getElementById('lang-ar').onclick = () => { localState.lang = 'ar'; syncToCloud(); location.reload(); };

        els.btnRecap.onclick = async () => {
            els.btnRecap.innerText = "⏳ recap...";
            try {
                const res = await callGemini([{ parts: [{ text: "Summarize session highlights professionally: " + JSON.stringify(localState.history) }] }], "Summary Engine", CONFIG.MODELS.TEXT, false);
                renderMsg("ai", "✨ **Session Recap:**\n\n" + res.candidates[0].content.parts[0].text);
            } catch(e) { notify("FAILED"); }
            els.btnRecap.innerText = "✨ Recap";
        };

        els.btnSend.onclick = chat;
        els.input.onkeydown = (e) => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); chat(); } };
        els.btnGate.onclick = () => { els.modalAdmin.classList.remove('hidden'); setTimeout(() => els.modalAdmin.classList.replace('opacity-0', 'opacity-100'), 10); };
        document.getElementById('btn-close-admin').onclick = () => { els.modalAdmin.classList.replace('opacity-100', 'opacity-0'); setTimeout(() => els.modalAdmin.classList.add('hidden'), 300); };

        document.getElementById('btn-export').onclick = () => {
            const data = { instructions: localState.instructions, qa: localState.qa };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'sporting-club-logic.json';
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
            notify("LOGIC EXPORTED");
        };

        document.getElementById('btn-import-trigger').onclick = () => document.getElementById('input-import').click();
        document.getElementById('input-import').onchange = (e) => {
            const f = e.target.files[0];
            e.target.value = '';
            if (!f) return;
            const r = new FileReader();
            r.onload = (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (Array.isArray(data.instructions) && data.instructions.every(t => typeof t === 'string')) {
                        localState.instructions = data.instructions;
                    }
                    if (Array.isArray(data.qa) && data.qa.every(it => it && typeof it.q === 'string' && typeof it.a === 'string')) {
                        localState.qa = data.qa;
                    }
                    syncToCloud();
                    renderAdminUI();
                    notify("LOGIC IMPORTED");
                } catch (err) { notify("INVALID FILE"); }
            };
            r.readAsText(f);
        };

        document.getElementById('btn-lock').onclick = () => { els.modalAdmin.classList.replace('opacity-100', 'opacity-0'); setTimeout(() => els.modalAdmin.classList.add('hidden'), 300); };

        init();
    </script>
</body>
</html>
